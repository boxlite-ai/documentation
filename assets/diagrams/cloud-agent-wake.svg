<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
<title id="title">A request wakes the box and its agent service</title>
<desc id="desc">An HTTPS request reaches Cloud, which starts the stopped box. The saved startup command starts the agent service, which executes the task and replies. After the idle window the box stops and retains its disk.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#51c5f5"/></marker></defs>
<rect width="640" height="520" rx="14" fill="#10151b"/>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle">
<g fill="#142532" stroke="#3b6479"><rect x="40" y="24" width="560" height="70" rx="8"/><rect x="40" y="126" width="560" height="70" rx="8"/><rect x="40" y="228" width="560" height="70" rx="8"/><rect x="40" y="330" width="560" height="70" rx="8"/></g>
<g fill="#e4f1f7" font-size="21"><text x="320" y="53">1. Your application sends a task</text><text x="320" y="155">2. Cloud starts the stopped box</text><text x="320" y="257">3. The startup command starts the service</text><text x="320" y="359">4. The agent executes and replies</text></g>
<g fill="#a7becd" font-size="15"><text x="320" y="77">Use the same registered HTTPS URL</text><text x="320" y="179">The proxy waits for the service to listen</text><text x="320" y="281">Restore private configuration from disk</text><text x="320" y="383">Real model calls, shell tools, and file operations</text></g>
<g stroke="#51c5f5" stroke-width="2" marker-end="url(#arrow)"><path d="M320 96V117"/><path d="M320 198V219"/><path d="M320 300V321"/><path d="M320 402V423"/></g>
<rect x="40" y="434" width="560" height="62" rx="8" fill="#192229" stroke="#75909f" stroke-dasharray="5 4"/>
<text x="320" y="460" fill="#e4f1f7" font-size="19">Idle window passes: the box stops</text>
<text x="320" y="482" fill="#a7becd" font-size="15">Disk retained. The next request starts the cycle again.</text>
</g></svg>