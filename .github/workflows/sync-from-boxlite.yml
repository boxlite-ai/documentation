name: Sync docs from BoxLite SDK

# Opens one docs PR per merged boxlite PR that has not been processed yet.
#
# Cadence note: this ran every 30 minutes from 2026-02-19 to 2026-09-27 and
# produced nothing at all, because the action inputs below were wrong (see the
# comment on the Claude step). Daily is the deliberate restart cadence — a
# dormant workflow should not wake up and open 48 agent-authored PRs a day
# against the live docs repo. Raise it once the output has been reviewed.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout documentation repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # Secrets are not inherited by forks, so a fork running this on a
      # schedule fails eight times a day with gh's generic "set GH_TOKEN"
      # error. Say what is actually wrong instead.
      - name: Require the credentials this workflow cannot run without
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$GH_PAT" ] || missing="$missing GH_PAT"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing."
            echo "::error::Forks do not inherit secrets — disable this workflow on forks."
            exit 1
          fi

          # GH_PAT must be able to write here, or Claude cannot push a branch
          # and open a PR. GitHub answers 404 rather than 403 when a token
          # lacks write on ref creation, which reads as "the endpoint is
          # wrong" and sent a previous debugging session down the wrong path.
          # Check it here, before spending an Anthropic API call on a run that
          # cannot deliver.
          if [ "$(GH_TOKEN="$GH_PAT" gh api "repos/${GITHUB_REPOSITORY}" --jq .permissions.push)" != "true" ]; then
            echo "::error::GH_PAT cannot write to ${GITHUB_REPOSITORY}; it can only read."
            echo "::error::Grant it Contents: write and Pull requests: write, or the sync can never open a PR."
            exit 1
          fi

      - name: Find unprocessed merged PRs
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # Recently merged boxlite PRs, newest first.
          MERGED_PRS=$(gh api "repos/boxlite-ai/boxlite/pulls?state=closed&sort=updated&direction=desc&per_page=20" \
            --jq '[.[] | select(.merged_at != null) | {number, title, html_url, user: .user.login}]')

          FOUND="false"
          for PR_NUMBER in $(echo "$MERGED_PRS" | jq -r '.[].number'); do
            BRANCH="docs-sync/boxlite-pr-${PR_NUMBER}"
            # A branch is the processed-marker: it exists whether the sync
            # produced changes or concluded that none were needed.
            if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
              continue
            fi
            if [ "$(gh pr list --head "$BRANCH" --state all --json number --jq 'length')" != "0" ]; then
              continue
            fi

            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pr_title=$(echo "$MERGED_PRS" | jq -r ".[] | select(.number == ${PR_NUMBER}) | .title")" >> "$GITHUB_OUTPUT"
            echo "pr_url=$(echo "$MERGED_PRS" | jq -r ".[] | select(.number == ${PR_NUMBER}) | .html_url")" >> "$GITHUB_OUTPUT"
            echo "pr_author=$(echo "$MERGED_PRS" | jq -r ".[] | select(.number == ${PR_NUMBER}) | .user")" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            FOUND="true"
            echo "Found unprocessed PR: #${PR_NUMBER}"
            break
          done

          if [ "$FOUND" = "false" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No unprocessed PRs found"
          fi

      # Written into the workspace, not /tmp, because the prompt cannot shell
      # out: `$(cat ...)` inside a YAML string is literal text, which is how
      # every prompt this workflow ever sent contained the characters
      # "$(cat /tmp/pr_diff.txt)" instead of a diff. Claude reads these files.
      - name: Collect the source PR into the workspace
        if: steps.find-pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p .docs-sync

          gh api "repos/boxlite-ai/boxlite/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.diff" \
            | head -c 200000 > .docs-sync/pr.diff

          gh api "repos/boxlite-ai/boxlite/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > .docs-sync/changed-files.txt

          gh api "repos/boxlite-ai/boxlite/pulls/${PR_NUMBER}" \
            --jq '.body // "No description provided"' > .docs-sync/pr-body.md

          echo "diff: $(wc -c < .docs-sync/pr.diff) bytes, $(wc -l < .docs-sync/changed-files.txt) changed files"

      - name: Run Claude Code Action
        if: steps.find-pr.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_PAT }}
          # v1 renamed `direct_prompt` to `prompt` and dropped `branch`,
          # `create_pr`, `pr_title` and `pr_body` entirely. Unknown inputs are
          # a warning, not an error, so the old spelling left this action with
          # an empty prompt and the job green for seven months. Claude opens
          # the PR itself now, with the git and gh tools granted below.
          prompt: |
            You are updating the BoxLite documentation site after a change merged in the BoxLite SDK repository.

            Source PR: boxlite-ai/boxlite#${{ steps.find-pr.outputs.pr_number }}
            Title: ${{ steps.find-pr.outputs.pr_title }}
            Author: ${{ steps.find-pr.outputs.pr_author }}
            URL: ${{ steps.find-pr.outputs.pr_url }}

            Read these files in the workspace first — they are the source PR, not documentation:
              .docs-sync/pr-body.md        the PR description
              .docs-sync/changed-files.txt the list of changed files
              .docs-sync/pr.diff           the diff

            Then:

            1. Read AGENTS.md and CLAUDE.md at the repo root. They own the conventions,
               the source-to-docs mapping, and the decision framework. Follow them.
            2. Decide whether this PR changes anything a reader of the docs would observe.
               Internal refactoring, tests and CI changes do not. API changes, new
               capabilities, changed defaults and changed behaviour do.
            3. If documentation changes are needed, make them. Do not add version numbers.
            4. Verify before you finish, and paste the real output:
                 python3 scripts/lint-docs.py .
                 python3 scripts/gen-llms-txt.py --check
               If the llms.txt check fails, run `python3 scripts/gen-llms-txt.py` and
               commit the result. Editing a page title or description stales it, not
               just editing navigation.
            5. Do not commit the .docs-sync/ directory. It is gitignored; keep it that way.

            Finish in exactly one of two ways:

            A. Changes were needed. Create the branch
               `docs-sync/boxlite-pr-${{ steps.find-pr.outputs.pr_number }}` from main, commit,
               push it, and open a pull request against main titled
               `docs: sync from boxlite PR #${{ steps.find-pr.outputs.pr_number }}`.
               The PR body must link the source PR and state what you verified.
               Then write the single word `changed` to .docs-sync/result.txt.

            B. No documentation change is warranted. Do not open a pull request.
               Write `no-change: <one sentence saying what you evaluated and why nothing follows from it>`
               to .docs-sync/result.txt.

            Writing .docs-sync/result.txt is not optional. A run that ends without it
            is treated as a failure, because that is indistinguishable from this action
            never having run at all — which is exactly what went unnoticed here before.

          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(python3:*)"

      # The whole point of this step: a silent no-op can never again look green.
      - name: Record the outcome, and fail if there is none
        if: steps.find-pr.outputs.found == 'true'
        env:
          # The job's own token, not GH_PAT: everything here touches this
          # repository only, and the job already declares contents: write.
          # GH_PAT stays on the action itself, so the pull requests Claude
          # opens are authored by a real account and therefore trigger CI —
          # a GITHUB_TOKEN-authored PR would not.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ ! -f .docs-sync/result.txt ]; then
            echo "::error::Claude produced no .docs-sync/result.txt — it either did not run or did nothing."
            echo "::error::Check the action step above for 'Unexpected input(s)' warnings before assuming an API failure."
            exit 1
          fi

          RESULT="$(cat .docs-sync/result.txt)"
          echo "result: ${RESULT}"

          case "$RESULT" in
            changed*)
              # Same reason as below: read it over the API, not through the
              # remote whose credential the action has already revoked.
              BRANCH="docs-sync/boxlite-pr-${PR_NUMBER}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
                echo "::error::Result says 'changed' but ${BRANCH} was never pushed."
                exit 1
              fi
              echo "::notice::Opened a docs PR for boxlite#${PR_NUMBER}."
              ;;
            no-change*)
              # Mark the source PR processed so the next run moves on, without
              # opening a PR nobody asked for.
              #
              # Created through the API rather than `git push`: the action
              # swaps in its own app token for git operations and revokes it
              # on the way out, so by this step the configured remote has no
              # usable credential and a push returns 403.
              SHA="$(git rev-parse HEAD)"
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/heads/docs-sync/boxlite-pr-${PR_NUMBER}" \
                -f "sha=${SHA}" >/dev/null
              echo "::notice::boxlite#${PR_NUMBER} needs no docs change: ${RESULT}"
              ;;
            *)
              echo "::error::Unrecognised result: ${RESULT}"
              exit 1
              ;;
          esac
